<!DOCTYPE html>
<html>
<head>
    <title>Chat Room Configuration</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-container">
    <h1>Chat Room Configuration</h1>

    <div id="successMessage" class="success-message">
        Settings saved successfully!
    </div>

    <div class="form-group">
        <h4>Chat Room Name</h4>
        <input type="text" id="roomName" class="form-control" placeholder="Enter a name for the Chat Room">
    </div>
    <h4>Main Topic and Instructions for ChatBot</h4>
    <textarea class="form-control" id="systemPrompt" rows="5"
              placeholder="Enter main topic of the discussion and provide custom instructions for the chatbot (optional)."></textarea>

    <div class="form-group">
        <button id="createRoom" class="accent">Create Room</button>
    </div>

    <div id="roomUrl" class="room-url">
        <h3>Room URL:</h3>
        <a href="" target="_blank"></a>
    </div>

    <div id="qrCodeContainer" class="qr-code-container">
        <h3>QR Code:</h3>
        <img id="qrCode"/>
    </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
