<!DOCTYPE html>
<html>
<head>
    <title>Chat Room Configuration</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-container">
    <h1>Chat Room Configuration</h1>

    <div id="successMessage" class="success-message">
        Settings saved successfully!
    </div>

    <div class="form-group">
        <input type="text" id="roomName" class="form-control" placeholder="Enter room name">
    </div>

    <div class="form-group">
        <button id="createRoom" class="accent">Create Room</button>
    </div>

    <div id="roomUrl" class="room-url">
        <h3>Room URL:</h3>
        <p></p>
    </div>

    <div id="qrCodeContainer" class="qr-code-container">
        <h3>QR Code:</h3>
        <img id="qrCode" alt="Room QR Code" />
    </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
