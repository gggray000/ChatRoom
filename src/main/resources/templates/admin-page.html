<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<script type="module" src="https://unpkg.com/@cap.js/widget@0.1.20/cap.min.js"></script>
<script type="module" src="https://unpkg.com/@cap.js/widget@0.1.20/cap-floating.min.js"></script>
<head>
    <meta charset="UTF-8">
    <title th:text="#{config}"></title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-container">
    <div class="languageSelect">
        <label for="languageSelect" th:text="#{lang-dropdown}"></label>
        <select id="languageSelect" class="form-control">
            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
            <option value="de" th:selected="${#locale.language == 'de'}">Deutsch</option>
            <option value="cn" th:selected="${#locale.language == 'cn'}">中文</option>
        </select>
    </div>

    <h2 th:text="#{config}"></h2>
    <div class="form-group">
        <h4 id="room-header" th:text="#{roomName}"></h4>
        <input type="text" id="roomName" class="form-control" th:placeholder="#{roomName.placeholder}">
    </div>
    <h4 id="prompt-header" th:text="#{prompt}"
    ></h4>
    <textarea class="form-control" id="systemPrompt" rows="5"
              th:placeholder="#{prompt.placeholder}"></textarea>

    <h4 id="timer-header" th:text="#{timer}"></h4>
    <div class="timer-slider-container">
        <input type="range" id="timerSlider" min="0" max="30" value="5" step="1" class="timer-slider">
        <div class="slider-labels">
            <span>0</span>
            <span>5</span>
            <span>10</span>
            <span>15</span>
            <span>20</span>
            <span>25</span>
            <span>30</span>
        </div>
        <div class="timer-display" id="timer-display" th:text="#{timer.display}">
        </div>
    </div>

    <div class="form-group create-room">
        <cap-widget
                class="cap-widget"
                id="cap"
                th:attr="data-cap-api-endpoint=@{${capAddr} + '/' + ${keyId} + '/api/'},
                         data-cap-i18n-verifying-label=#{cap.verifying},
                         data-cap-i18n-initial-state=#{cap.initial},
                         data-cap-i18n-solved-label=#{cap.solved},
                         data-cap-i18n-error-label=#{cap.error}"
        ></cap-widget>
        <button id="createRoom"
                class="accent"
                th:text="#{create-button}">
        </button>
    </div>

</div>

<script>
    function updateLocale() {
        const selectedLocale = document.getElementById("languageSelect").value;
        const url = new URL(window.location.href);
        const currentLocale = url.searchParams.get("locale");
        if (currentLocale !== selectedLocale) {
            url.searchParams.set("locale", selectedLocale);
            window.location.href = url.toString();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateLocale()
    });
    document.getElementById("languageSelect").addEventListener("change", updateLocale);
</script>
<script src="https://unpkg.com/i18next@25.2.1/i18next.min.js"></script>
<script src="https://unpkg.com/i18next-http-backend@3.0.2/i18nextHttpBackend.min.js"></script>
<script src="https://unpkg.com/i18next-browser-languagedetector@8.2.0/i18nextBrowserLanguageDetector.min.js"></script>
<script type="module" src="/js/modules/i18n.js"></script>
<script type="module" src="/js/admin.js"></script>

</body>
</html>
