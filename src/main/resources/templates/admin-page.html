<!DOCTYPE html>
<html>
<head>
    <title>Chat Room Configuration</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-container">
    <h2>Chat Room Configuration</h2>
    <div class="form-group">
        <h4 id="room-header">Chat Room Name</h4>
        <input type="text" id="roomName" class="form-control" placeholder="Enter a name for the Chat Room">
    </div>
    <h4 id="prompt-header">Discussion Topic and Instructions for ChatBot</h4>
    <textarea class="form-control" id="systemPrompt" rows="5"
              placeholder="Enter main topic of the discussion and provide custom instructions for the chatbot (optional)."></textarea>

    <h4 id="timer-header">Set Discussion Timer</h4>
    <div class="timer-slider-container">
        <input type="range" id="timerSlider" min="0" max="30" value="5" step="1" class="timer-slider">
        <div class="slider-labels">
            <span>0</span>
            <span>5</span>
            <span>10</span>
            <span>15</span>
            <span>20</span>
            <span>25</span>
            <span>30</span>
        </div>
        <div class="timer-display" id="timer-display">
            Selected time: 5 minutes
        </div>
    </div>

    <div class="form-group">
        <button id="createRoom" class="accent">Create Room</button>
    </div>

</div>

<script src="/js/admin.js"></script>
</body>
</html>
