<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<script th:inline="javascript">
    window.ROOM_ID = /*[[${roomId}]]*/ '';
    window.ROOM_NAME = /*[[${roomName}]]*/ '';
</script>

<div id="username-page">
    <div class="username-page-container">
        <h1 class="title">Type a username to enter Chatroom</h1>
        <form id="usernameForm" name="usernameForm">
            <div class="form-group">
                <input type="text" id="name" placeholder="Username" autocomplete="off" class="form-control" />
            </div>
            <div class="form-group">
                <button type="button" class="nickname-generate">Get Nickname</button>
                <button type="submit" class="username-submit">Start Chatting</button>
            </div>
        </form>
    </div>
</div>

<div id="chat-page" class="hidden">
    <div class="chat-container">
        <button class="toggle-sidebar">☰</button>
        <div class="user-list-sidebar">
            <div class="user-list-header">
                <div id="user-count">Online Users: 0</div>
            </div>
            <div id="user-list"></div>
            <div id="user-info" class="hidden"></div>
        </div>

        <div class="main-chat-area">
            <div class="chat-header">
                <div class="title-timer-container">
                    <h2></h2>
                    <div class="countdown"
                         th:data-minutes="${timerMinutes}"
                         th:data-seconds="${timerSeconds}"
                         th:data-total-seconds="${timerMinutes * 60 + timerSeconds}"
                         th:data-running="false">
                        <span class="minutes" th:text="${#numbers.formatInteger(timerMinutes, 2)}">00</span>:<span
                            class="seconds" th:text="${#numbers.formatInteger(timerSeconds, 2)}">00</span>
                    </div>
                </div>
                <div class="button-container">
                    <button id="summarizeBtn" class="admin-btn hidden">Summarize</button>
                    <button id="timerBtn" class="timer-btn hidden">Pause/Continue</button>
                    <button id="shutdownBtn" class="shutdown-btn hidden">Shutdown</button>
                    <button id="disconnectBtn" class="disconnect-btn hidden">Disconnect</button>
                </div>

                <button id="disconnectBtnUser" class="disconnect-btn-user hidden">Disconnect</button>

                <img src="/images/logo.png" alt="logo" class="logo">
            </div>

            <div class="connecting">
                Connecting...
            </div>

            <ul id="messageArea"></ul>

            <form id="messageForm" name="messageForm">
                <div class="form-group">
                    <div class="input-group clearfix">
                        <textarea id="textArea" placeholder="Type a message..." autocomplete="off" class="form-control"></textarea>
                        <button type="submit" class="primary">Send</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    window.ROOM_ID = /*[[${roomId}]]*/ null;
    window.ROOM_NAME = /*[[${roomName}]]*/ null;
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.1/markdown-it.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.1/purify.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
